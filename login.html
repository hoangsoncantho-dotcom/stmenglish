<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập không gian học tập - STM English</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ========================================================
           1. THIẾT LẬP NỀN TẢNG & BIẾN MÀU SẮC ĐỒNG BỘ
           ======================================================== */
        :root {
            --primary: #0284c7;         /* Xanh dương chủ đạo (#0284c7) */
            --primary-dark: #0369a1;    /* Xanh dương đậm */
            --primary-deep: #0c4a6e;    /* Xanh navy biển sâu */
            --navy-dark: #0f172a;       /* Chữ tiêu đề chính */
            --bg-page: #f0f4f8;         /* Nền xám xanh nhạt dịu mắt */
            --bg-card: #ffffff;         /* Nền thẻ trắng tinh khiết */
            --border-color: #e2e8f0;    /* Viền tinh tế */
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --shadow-card: 0 20px 45px rgba(2, 132, 199, 0.1), 0 4px 15px rgba(15, 23, 42, 0.04);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Vòng tròn trang trí mờ phía sau tạo chiều sâu */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.15) 0%, rgba(2, 132, 199, 0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(3, 105, 161, 0.12) 0%, rgba(3, 105, 161, 0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        /* ========================================================
           2. KHUNG ĐĂNG NHẬP (LOGIN CARD)
           ======================================================== */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(226, 232, 240, 0.85);
            position: relative;
            z-index: 1;
            text-align: center;
            transition: var(--transition);
        }

        /* Logo STM English */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .logo-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-deep));
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
        }

        .brand-title {
            font-family: 'Lexend', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--navy-dark);
            letter-spacing: -0.3px;
        }

        .brand-title span {
            color: var(--primary);
        }

        /* Tiêu đề trang */
        .login-heading {
            font-family: 'Lexend', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--navy-dark);
            margin-bottom: 0.45rem;
            letter-spacing: -0.4px;
        }

        .login-subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* ========================================================
           3. FORM & TRƯỜNG NHẬP LIỆU (INPUTS)
           ======================================================== */
        .form-group {
            text-align: left;
            margin-bottom: 1.4rem;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--navy-dark);
            margin-bottom: 0.5rem;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1.1rem;
            color: var(--text-light);
            font-size: 1.05rem;
            pointer-events: none;
            transition: var(--transition);
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1.1rem 0.9rem 2.85rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
        }

        .form-input:focus + .input-icon {
            color: var(--primary);
        }

        /* Nút con mắt ẩn/hiện mật khẩu */
        .toggle-pwd {
            position: absolute;
            right: 1.1rem;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 0.2rem;
        }

        .toggle-pwd:hover {
            color: var(--navy-dark);
        }

        /* ========================================================
           4. THẺ THÔNG BÁO TRẠNG THÁI (LOGIN-MESSAGE)
           ======================================================== */
        #login-message {
            min-height: 0;
            margin-bottom: 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            font-weight: 600;
            text-align: left;
            transition: var(--transition);
            display: none;
            align-items: center;
            gap: 0.65rem;
            padding: 0.85rem 1.1rem;
        }

        #login-message.error {
            display: flex;
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        #login-message.loading {
            display: flex;
            background-color: #f0f9ff;
            color: var(--primary-dark);
            border: 1px solid #bae6fd;
        }

        #login-message.success {
            display: flex;
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        /* ========================================================
           5. NÚT ĐĂNG NHẬP & LIÊN KẾT ĐIỀU HƯỚNG
           ======================================================== */
        .btn-login-submit {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 1.02rem;
            font-weight: 700;
            font-family: 'Lexend', sans-serif;
            border: none;
            border-radius: var(--radius-md);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.32);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
        }

        .btn-login-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.45);
            background: linear-gradient(135deg, #0284c7, var(--primary-deep));
        }

        .btn-login-submit:active {
            transform: translateY(0);
        }

        /* Liên kết quay lại trang chủ */
        .back-home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 1.6rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
        }

        .back-home-link:hover {
            color: var(--primary);
            transform: translateX(-3px);
        }

        /* ========================================================
           6. THIẾT KẾ ĐÁP ỨNG CHO MOBILE (RESPONSIVE)
           ======================================================== */
        @media (max-width: 480px) {
            .login-card {
                padding: 2.5rem 1.8rem;
                border-radius: 16px;
            }

            .login-heading {
                font-size: 1.4rem;
            }

            .logo-box {
                width: 56px;
                height: 56px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Khung Thẻ Đăng Nhập Căn Giữa Màn Hình -->
    <main class="login-card">
        
        <!-- Logo STM -->
        <div class="brand-header">
            <div class="logo-box">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="brand-title">
                STM <span>English</span>
            </div>
        </div>

        <!-- Tiêu đề chính -->
        <h1 class="login-heading">Đăng nhập không gian học tập</h1>
        <p class="login-subtitle">Nhập mã học sinh của bạn để vào phòng học trực tuyến</p>

        <!-- Form Đăng Nhập -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            
            <!-- Ô nhập: Mã học sinh -->
            <div class="form-group">
                <label class="form-label" for="student_id">Mã học sinh</label>
                <div class="input-container">
                    <input type="text" name="student_id" id="student_id" class="form-input" placeholder="Ví dụ: E6-03 hoặc E8-01" required autocomplete="username">
                    <i class="fa-regular fa-id-card input-icon"></i>
                </div>
            </div>

            <!-- Ô nhập: Mật khẩu -->
            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <div class="input-container">
                    <input type="password" name="password" id="password" class="form-input" placeholder="Nhập mật khẩu của bạn" required autocomplete="current-password">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Ẩn hoặc hiện mật khẩu" onclick="togglePassword()">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Thẻ hiển thị thông báo trạng thái đặt ngay bên trên nút bấm -->
            <div id="login-message"></div>

            <!-- Nút bấm Đăng nhập hệ thống -->
            <button type="submit" class="btn-login-submit" id="btn-login">
                <span>Đăng nhập hệ thống</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>

            <!-- Liên kết nhỏ: Quay lại Trang chủ -->
            <div>
                <a href="index.html" class="back-home-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Quay lại Trang chủ</span>
                </a>
            </div>

        </form>

    </main>

    <!-- JavaScript xử lý giao diện tinh gọn -->
    <script>
        // Ẩn/Hiện mật khẩu
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Xử lý sự kiện gửi form mẫu (chuyển hướng sang classroom.html)
        function handleLoginSubmit(e) {
            e.preventDefault();
            const studentId = document.getElementById('student_id').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgBox = document.getElementById('login-message');
            const btnSubmit = document.getElementById('btn-login');

            if (!studentId || !password) {
                msgBox.className = 'error';
                msgBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> <span>Vui lòng nhập đầy đủ mã học sinh và mật khẩu!</span>';
                msgBox.style.display = 'flex';
                return;
            }

            // Trạng thái đang tải (Loading)
            msgBox.className = 'loading';
            msgBox.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Đang kiểm tra thông tin học viên...</span>';
            msgBox.style.display = 'flex';
            btnSubmit.disabled = true;
            btnSubmit.style.opacity = '0.75';

            // Mô phỏng xác thực và chuyển hướng vào classroom.html
            setTimeout(() => {
                msgBox.className = 'success';
                msgBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Đăng nhập thành công! Đang chuyển hướng...</span>';
                
                // Lưu mã học sinh để trang classroom.html hiển thị lời chào
                localStorage.setItem('stm_user', studentId);

                setTimeout(() => {
                    window.location.href = 'classroom.html';
                }, 800);
            }, 700);
        }
    </script>
</body>
</html>
