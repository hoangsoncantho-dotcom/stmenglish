<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Khảo thí STM English</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-page: #f0f4f8;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }
        
        .quiz-container { max-width: 800px; margin: 0 auto; }
        
        /* Header & Info Bar */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--primary-dark); font-size: 1.2rem; }
        .student-badge { background: #e0f2fe; color: var(--primary-dark); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        
        .info-bar { display: flex; justify-content: space-between; background: white; padding: 1rem 1.5rem; border-radius: var(--radius-lg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1.5rem; font-weight: 600; }
        .timer { color: #dc2626; display: flex; align-items: center; gap: 8px; }
        
        /* Khung câu hỏi */
        .question-card { background: white; padding: 2rem; border-radius: var(--radius-lg); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        .question-type-badge { display: inline-block; background: #f1f5f9; color: var(--text-muted); padding: 0.3rem 0.8rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .question-text { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.5; }
        
        /* Hỗ trợ Listening & Reading */
        .audio-player { width: 100%; margin-bottom: 1.5rem; outline: none; }
        .reading-passage { background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem; max-height: 200px; overflow-y: auto; line-height: 1.7; font-size: 0.95rem; }
        
        /* Các đáp án */
        .options-grid { display: flex; flex-direction: column; gap: 1rem; }
        .option-btn { display: flex; align-items: center; gap: 1rem; width: 100%; padding: 1rem 1.5rem; text-align: left; background: white; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: all 0.2s; color: var(--text-main); }
        .option-btn:hover { border-color: #bae6fd; background: #f0f9ff; }
        .option-btn.selected { border-color: var(--primary); background: #f0f9ff; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); }
        
        .option-marker { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); transition: all 0.2s; }
        .option-btn.selected .option-marker { background: var(--primary); border-color: var(--primary); color: white; }

        /* Nút điều hướng */
        .nav-buttons { display: flex; justify-content: space-between; }
        .btn { padding: 0.8rem 2rem; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: all 0.2s; border: none; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-muted); }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-primary { background: var(--primary); color: white; display: flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--primary-dark); }
        
        /* Khung Kết quả */
        #result-screen { display: none; text-align: center; }
        .score-box { background: #f0f9ff; border: 2px solid #bae6fd; border-radius: var(--radius-lg); padding: 2rem; margin: 2rem 0; display: flex; justify-content: space-around; }
        .score-item h3 { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.5rem; }
        .score-item p { font-size: 3rem; font-weight: 800; color: var(--primary); }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Header -->
    <header class="quiz-header">
        <div class="logo-area"><i class="fa-solid fa-graduation-cap"></i> STM English</div>
        <div class="student-badge" id="student-name"><i class="fa-regular fa-user"></i> Thí sinh</div>
    </header>

    <!-- Màn hình làm bài -->
    <div id="quiz-screen">
        <div class="info-bar">
            <div id="progress">Câu 1 / 15</div>
            <div class="timer"><i class="fa-regular fa-clock"></i> <span id="time">45:00</span></div>
        </div>

        <div class="question-card" id="question-container">
            <!-- Nội dung câu hỏi sẽ được JavaScript render vào đây -->
        </div>

        <div class="nav-buttons">
            <button class="btn btn-outline" id="btn-prev" onclick="prevQuestion()">Quay lại</button>
            <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">Tiếp theo <i class="fa-solid fa-arrow-right"></i></button>
            <button class="btn btn-primary" id="btn-submit" onclick="submitQuiz()" style="display: none;"><i class="fa-solid fa-paper-plane"></i> Nộp Bài</button>
        </div>
    </div>

    <!-- Màn hình kết quả -->
    <div id="result-screen" class="question-card">
        <div style="font-size: 3rem; color: #fbbf24; margin-bottom: 1rem;"><i class="fa-solid fa-trophy"></i></div>
        <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">KẾT QUẢ BÀI THI</h2>
        <p style="color: var(--text-muted);">Hệ thống trắc nghiệm tự động STM English</p>
        
        <div class="score-box">
            <div class="score-item"><h3>Điểm số (Thang 10)</h3><p id="final-score">0.0</p></div>
            <div class="score-item" style="border-left: 2px solid #bae6fd; padding-left: 2rem;"><h3>Số câu đúng</h3><p id="correct-count" style="color: #10b981;">0 / 0</p></div>
        </div>
        
        <div style="background: #f8fafc; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; text-align: left; font-size: 0.95rem; line-height: 1.6;">
            <i class="fa-solid fa-book-open" style="color: var(--primary);"></i> <strong>Thầy Nguyễn Hoàng Sơn nhắn nhủ:</strong> Hệ thống đã tự động lưu điểm của em. Đừng quên xem lại những câu làm sai để rút kinh nghiệm nhé!
        </div>
        
        <button class="btn btn-primary" style="margin: 0 auto;" onclick="window.location.href='classroom.html'"><i class="fa-solid fa-door-open"></i> Quay lại Lớp Học</button>
    </div>
</div>

<script>
    // 1. NGÂN HÀNG DỮ LIỆU ĐỀ THI (Tiếng Anh 8 - Global Success - Giữa kỳ 1)
    const rawQuizData = [
        // --- PHẦN PHÁT ÂM & TRỌNG ÂM ---
        {
            type: "grammar", tag: "Phát âm /ʊ/ vs /uː/",
            question: "Mark the letter A, B, C, or D to indicate the word whose underlined part differs from the other three in pronunciation:<br><br><b>A.</b> c<u>oo</u>k &nbsp;&nbsp; <b>B.</b> f<u>oo</u>t &nbsp;&nbsp; <b>C.</b> b<u>oo</u>k &nbsp;&nbsp; <b>D.</b> p<u>oo</u>l",
            options: ["cook", "foot", "book", "pool"],
            correct_answer: "pool"
        },
        {
            type: "grammar", tag: "Trọng âm",
            question: "Mark the letter A, B, C, or D to indicate the word that differs from the other three in the position of primary stress:<br><br><b>A.</b> origami &nbsp;&nbsp; <b>B.</b> hospitable &nbsp;&nbsp; <b>C.</b> activity &nbsp;&nbsp; <b>D.</b> traditional",
            options: ["origami", "hospitable", "activity", "traditional"],
            correct_answer: "origami"
        },

        // --- PHẦN TỪ VỰNG & NGỮ PHÁP ---
        {
            type: "grammar", tag: "Từ vựng (Sở thích)",
            question: "My younger sister is very ______ on doing DIY projects, especially making handmade greeting cards.",
            options: ["fond", "keen", "hooked", "interested"],
            correct_answer: "keen"
        },
        {
            type: "grammar", tag: "Ngữ pháp (So sánh hơn trạng từ)",
            question: "During the harvest season, the local farmers have to work much ______ than usual.",
            options: ["more hard", "harder", "hardest", "more hardly"],
            correct_answer: "harder"
        },
        {
            type: "grammar", tag: "Ngữ pháp (Verbs of liking)",
            question: "Many teenagers adore ______ to pop music when they are relaxing in their bedrooms.",
            options: ["listen", "listening", "listened", "to listening"],
            correct_answer: "listening"
        },
        {
            type: "grammar", tag: "Từ vựng đồng nghĩa",
            question: "Mark the word(s) CLOSEST in meaning to the underlined word:<br>Life in my grandparents' village is very <u>tranquil</u> and free from heavy traffic jams.",
            options: ["peaceful", "noisy", "hectic", "crowded"],
            correct_answer: "peaceful"
        },
        {
            type: "grammar", tag: "Tìm lỗi sai",
            question: "Indicate the underlined part that needs correction:<br>Nam told me that he really <u>fancies</u> <u>to play</u> online games with his friends.",
            options: ["told", "fancies", "to play", "with"],
            correct_answer: "to play"
        },

        // --- PHẦN GIAO TIẾP ---
        {
            type: "grammar", tag: "Giao tiếp xã hội",
            question: "<b>Minh:</b> \"Would you like to join our school chess club this Friday?\"<br><b>Lan:</b> \"______\"",
            options: [
                "Yes, I'd love to. Thanks!", 
                "Not at all.", 
                "You're welcome.", 
                "No, I don't think so."
            ],
            correct_answer: "Yes, I'd love to. Thanks!"
        },

        // --- PHẦN ĐỌC ĐIỀN TỪ (CLOZE TEST) ---
        {
            type: "reading", tag: "Đọc điền từ (Câu 1)",
            passage: "Leisure activities play a vital role in teenage life. In the past, young people often spent their spare time playing traditional games, making (1) ______ like paper kites, or helping their families with farming tasks. Today, the way teenagers spend their free time has changed dramatically.",
            question: "Choose the correct word for blank (1):",
            options: ["crafts", "crops", "cattle", "puzzles"],
            correct_answer: "crafts"
        },
        {
            type: "reading", tag: "Đọc điền từ (Câu 2)",
            passage: "With the development of modern technology, many teens prefer (2) ______ through social media feeds and playing video games on smartphones. While digital entertainment can be fun, spending too much screen time can lead to health problems.",
            question: "Choose the correct word for blank (2):",
            options: ["scroll", "scrolling", "scrolled", "to scrolling"],
            correct_answer: "scrolling"
        },

        // --- PHẦN ĐỌC HIỂU (READING COMPREHENSION) ---
        {
            type: "reading", tag: "Đọc hiểu (Ý chính)",
            passage: "Growing up in a Vietnamese rural village offers children a childhood filled with memorable experiences. Unlike urban kids who often stay indoors with computers and air-conditioned rooms, village children spend most of their after-school hours outdoors in the vast open spaces.<br><br>During the summer months, the village is filled with laughter. Children often gather on the dykes to fly colourful paper kites or play folk games such as hide-and-seek and tug-of-war. In the late afternoon, they often help their parents herd water buffaloes back to the sheds or take them to the local river for a bath. Swimming in cool, clean canals is also a favourite pastime on sweltering days.",
            question: "What is the main topic of the passage?",
            options: [
                "Modern farming equipment in Vietnam.", 
                "The daily life and leisure of rural children in Vietnam.", 
                "The disadvantages of living in big cities.", 
                "How to fly paper kites on village dykes."
            ],
            correct_answer: "The daily life and leisure of rural children in Vietnam."
        },
        {
            type: "reading", tag: "Đọc hiểu (Chi tiết)",
            passage: "During the summer months, the village is filled with laughter. Children often gather on the dykes to fly colourful paper kites or play folk games such as hide-and-seek and tug-of-war. In the late afternoon, they often help their parents herd water buffaloes back to the sheds or take them to the local river for a bath.",
            question: "According to the passage, what do children often do on the dykes in summer?",
            options: [
                "Study for their midterm examinations.", 
                "Fly paper kites and play folk games.", 
                "Drive combine harvesters.", 
                "Watch films on their smartphones."
            ],
            correct_answer: "Fly paper kites and play folk games."
        },

        // --- PHẦN VIẾT TRẮC NGHIỆM HÓA (SENTENCE TRANSFORMATION) ---
        {
            type: "writing_mcq", tag: "Viết (Biến đổi câu)",
            question: "Choose the sentence that has the CLOSEST meaning to the original one:<br><b>I enjoy making origami animals in my spare time.</b>",
            options: [
                "I am tired of making origami animals in my spare time.", 
                "I am interested in making origami animals in my spare time.", 
                "I hate making origami animals in my spare time.", 
                "I am afraid of making origami animals in my spare time."
            ],
            correct_answer: "I am interested in making origami animals in my spare time."
        },
        {
            type: "writing_mcq", tag: "Viết (Biến đổi câu)",
            question: "Choose the sentence that has the CLOSEST meaning to the original one:<br><b>Nam runs faster than any other student in his secondary school.</b>",
            options: [
                "No student in Nam's secondary school runs faster than him.", 
                "Every student in Nam's secondary school runs faster than him.", 
                "Nam runs as fast as other students in his secondary school.", 
                "Nam is the slowest student in his secondary school."
            ],
            correct_answer: "No student in Nam's secondary school runs faster than him."
        },
        {
            type: "writing_mcq", tag: "Viết (Biến đổi câu)",
            question: "Choose the sentence that has the CLOSEST meaning to the original one:<br><b>Work hard or you will not pass the upcoming midterm test.</b>",
            options: [
                "If you work hard, you will not pass the upcoming midterm test.", 
                "If you don't work hard, you will pass the upcoming midterm test.", 
                "If you don't work hard, you will not pass the upcoming midterm test.", 
                "Unless you don't work hard, you will not pass the upcoming midterm test."
            ],
            correct_answer: "If you don't work hard, you will not pass the upcoming midterm test."
        }
    ];

    // 2. THUẬT TOÁN TRỘN ĐỀ (SHUFFLE)
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    // Khởi tạo đề thi đã trộn
    let quizData = shuffleArray(rawQuizData);
    let currentQuestionIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null); // Lưu đáp án thí sinh chọn

    // 3. HIỂN THỊ TÊN HỌC SINH TỪ LOCALSTORAGE
    document.addEventListener("DOMContentLoaded", () => {
        const studentName = localStorage.getItem('stm_user') || localStorage.getItem('student_name');
        if (studentName) {
            document.getElementById('student-name').innerHTML = `<i class="fa-regular fa-user"></i> ${studentName}`;
        }
        renderQuestion();
        startTimer(45 * 60); // Đếm ngược 45 phút cho 15 câu
    });

    // 4. HÀM VẼ GIAO DIỆN CÂU HỎI
    function renderQuestion() {
        const q = quizData[currentQuestionIndex];
        const container = document.getElementById('question-container');
        
        // Trộn ngẫu nhiên 4 đáp án của câu hỏi này
        // (Chỉ trộn lần đầu tiên khi render, nếu đã chọn thì không trộn lại để giữ vị trí)
        if (!q.shuffledOptions) {
            q.shuffledOptions = shuffleArray(q.options);
        }
        const optionsList = q.shuffledOptions;
        
        let html = `<div class="question-type-badge">${q.tag}</div>`;
        
        // Render Audio nếu là câu Listening
        if (q.type === "listening" && q.audio_url) {
            html += `<audio controls class="audio-player"><source src="${q.audio_url}" type="audio/mpeg">Trình duyệt không hỗ trợ audio.</audio>`;
        }
        
        // Render Đoạn văn nếu là câu Reading
        if (q.type === "reading" && q.passage) {
            html += `<div class="reading-passage">${q.passage}</div>`;
        }
        
        html += `<div class="question-text">${currentQuestionIndex + 1}. ${q.question}</div>`;
        html += `<div class="options-grid">`;
        
        const labels = ['A', 'B', 'C', 'D'];
        optionsList.forEach((opt, index) => {
            const isSelected = userAnswers[currentQuestionIndex] === opt ? 'selected' : '';
            // Gắn sự kiện onclick truyền chuỗi nội dung đáp án
            html += `
                <div class="option-btn ${isSelected}" onclick="selectOption('${opt.replace(/'/g, "\\'")}')">
                    <div class="option-marker">${labels[index]}</div>
                    <div>${opt}</div>
                </div>
            `;
        });
        
        html += `</div>`;
        container.innerHTML = html;
        
        // Cập nhật thanh tiến độ và nút bấm
        document.getElementById('progress').innerText = `Câu ${currentQuestionIndex + 1} / ${quizData.length}`;
        document.getElementById('btn-prev').style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
        
        if (currentQuestionIndex === quizData.length - 1) {
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'flex';
        } else {
            document.getElementById('btn-next').style.display = 'flex';
            document.getElementById('btn-submit').style.display = 'none';
        }
    }

    // 5. CÁC HÀM XỬ LÝ SỰ KIỆN
    function selectOption(selectedText) {
        userAnswers[currentQuestionIndex] = selectedText;
        renderQuestion(); // Render lại để cập nhật màu xanh cho đáp án đã chọn
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    // 6. CHẤM ĐIỂM & KẾT THÚC
    function submitQuiz() {
        let correctCount = 0;
        for (let i = 0; i < quizData.length; i++) {
            if (userAnswers[i] === quizData[i].correct_answer) {
                correctCount++;
            }
        }
        
        const score10 = ((correctCount / quizData.length) * 10).toFixed(1);
        
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('correct-count').innerText = `${correctCount} / ${quizData.length}`;
        document.getElementById('final-score').innerText = score10;
        
        // Tương lai: Gọi lệnh fetch(GAS_URL) ở đây để đẩy điểm (Tên + Điểm) về Sheets cho Thầy Sơn.
    }

    // 7. ĐỒNG HỒ ĐẾM NGƯỢC
    function startTimer(durationInSeconds) {
        let timer = durationInSeconds;
        const timeDisplay = document.getElementById('time');
        
        const interval = setInterval(() => {
            let minutes = parseInt(timer / 60, 10);
            let seconds = parseInt(timer % 60, 10);
            
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            timeDisplay.innerText = minutes + ":" + seconds;
            
            if (--timer < 0) {
                clearInterval(interval);
                alert("Hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
                submitQuiz();
            }
        }, 1000);
    }
</script>
</body>
</html>
