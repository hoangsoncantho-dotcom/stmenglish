<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Khảo thí STM English - Tiếng Anh 9</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-page: #f0f4f8;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }
        
        .quiz-container { max-width: 800px; margin: 0 auto; }
        
        /* Header & Info Bar */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--primary-dark); font-size: 1.2rem; }
        .student-badge { background: #e0f2fe; color: var(--primary-dark); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        
        .info-bar { display: flex; justify-content: space-between; background: white; padding: 1rem 1.5rem; border-radius: var(--radius-lg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1.5rem; font-weight: 600; }
        .timer { color: #dc2626; display: flex; align-items: center; gap: 8px; }
        
        /* Khung câu hỏi */
        .question-card { background: white; padding: 2rem; border-radius: var(--radius-lg); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        .question-type-badge { display: inline-block; background: #f1f5f9; color: var(--text-muted); padding: 0.3rem 0.8rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .question-text { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.5; }
        
        /* Hỗ trợ Listening & Reading */
        .audio-player { width: 100%; margin-bottom: 1.5rem; outline: none; }
        .reading-passage { background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem; max-height: 220px; overflow-y: auto; line-height: 1.7; font-size: 0.95rem; }
        
        /* Các đáp án */
        .options-grid { display: flex; flex-direction: column; gap: 1rem; }
        .option-btn { display: flex; align-items: center; gap: 1rem; width: 100%; padding: 1rem 1.5rem; text-align: left; background: white; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: all 0.2s; color: var(--text-main); }
        .option-btn:hover { border-color: #bae6fd; background: #f0f9ff; }
        .option-btn.selected { border-color: var(--primary); background: #f0f9ff; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); }
        
        .option-marker { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); transition: all 0.2s; }
        .option-btn.selected .option-marker { background: var(--primary); border-color: var(--primary); color: white; }

        /* Nút điều hướng */
        .nav-buttons { display: flex; justify-content: space-between; }
        .btn { padding: 0.8rem 2rem; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: all 0.2s; border: none; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-muted); }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-primary { background: var(--primary); color: white; display: flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--primary-dark); }
        
        /* Khung Kết quả */
        #result-screen { display: none; text-align: center; }
        .score-box { background: #f0f9ff; border: 2px solid #bae6fd; border-radius: var(--radius-lg); padding: 2rem; margin: 2rem 0; display: flex; justify-content: space-around; }
        .score-item h3 { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.5rem; }
        .score-item p { font-size: 3rem; font-weight: 800; color: var(--primary); }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Header -->
    <header class="quiz-header">
        <div class="logo-area"><i class="fa-solid fa-graduation-cap"></i> STM English - Tiếng Anh 9</div>
        <div class="student-badge" id="student-name"><i class="fa-regular fa-user"></i> Thí sinh</div>
    </header>

    <!-- Màn hình làm bài -->
    <div id="quiz-screen">
        <div class="info-bar">
            <div id="progress">Câu 1 / 10</div>
            <div class="timer"><i class="fa-regular fa-clock"></i> <span id="time">60:00</span></div>
        </div>

        <div class="question-card" id="question-container">
            <!-- Nội dung câu hỏi sẽ được JavaScript render vào đây -->
        </div>

        <div class="nav-buttons">
            <button class="btn btn-outline" id="btn-prev" onclick="prevQuestion()">Quay lại</button>
            <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">Tiếp theo <i class="fa-solid fa-arrow-right"></i></button>
            <button class="btn btn-primary" id="btn-submit" onclick="submitQuiz()" style="display: none;"><i class="fa-solid fa-paper-plane"></i> Nộp Bài</button>
        </div>
    </div>

    <!-- Màn hình kết quả -->
    <div id="result-screen" class="question-card">
        <div style="font-size: 3rem; color: #fbbf24; margin-bottom: 1rem;"><i class="fa-solid fa-trophy"></i></div>
        <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">KẾT QUẢ BÀI THI</h2>
        <p style="color: var(--text-muted);">Hệ thống trắc nghiệm tự động STM English</p>
        
        <div class="score-box">
            <div class="score-item"><h3>Điểm số (Thang 10)</h3><p id="final-score">0.0</p></div>
            <div class="score-item" style="border-left: 2px solid #bae6fd; padding-left: 2rem;"><h3>Số câu đúng</h3><p id="correct-count" style="color: #10b981;">0 / 0</p></div>
        </div>
        
        <div style="background: #f8fafc; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; text-align: left; font-size: 0.95rem; line-height: 1.6;">
            <i class="fa-solid fa-book-open" style="color: var(--primary);"></i> <strong>Thầy Nguyễn Hoàng Sơn nhắn nhủ:</strong> Hệ thống đã tự động ghi nhận kết quả rèn luyện của em. Chúc mừng em đã hoàn thành bài thi khảo sát năng lực!
        </div>
        
        <button class="btn btn-primary" style="margin: 0 auto;" onclick="window.location.href='classroom.html'"><i class="fa-solid fa-door-open"></i> Quay lại Lớp Học</button>
    </div>
</div>

<script>
    // 1. NGÂN HÀNG DỮ LIỆU ĐỀ THI TIẾNG ANH 9 (GLOBAL SUCCESS - GIỮA KỲ 1)
    const rawQuizData = [
        // --- PHẦN I: LISTENING ---
        {
            type: "listening", tag: "Listening - Part 1 (Trip to Bat Trang)",
            audio_url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            question: "<b>[Audio Track 1]</b> How did Nam and Sarah travel to Bat Trang village?",
            options: ["By electric bus", "By bicycle", "By private car", "By sky train"],
            correct_answer: "By electric bus"
        },
        {
            type: "listening", tag: "Listening - Part 1 (Trip to Bat Trang)",
            audio_url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            question: "<b>[Audio Track 1]</b> What traditional product did Sarah try making on the potter's wheel?",
            options: ["A ceramic tea cup", "A small clay vase", "A decorative plate", "A flower pot"],
            correct_answer: "A small clay vase"
        },
        {
            type: "listening", tag: "Listening - Part 2 (Coping with Stress)",
            audio_url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            question: "<b>[Audio Track 2]</b> According to the school psychologist, what is the primary cause of teen stress?",
            options: [
                "Heavy academic expectations and upcoming exams",
                "Difficulties in making new school friends",
                "Lack of modern electronic devices",
                "Conflict with neighborhood helpers"
            ],
            correct_answer: "Heavy academic expectations and upcoming exams"
        },

        // --- PHẦN II: MULTIPLE CHOICE ---
        {
            type: "grammar", tag: "Phrasal Verb (Unit 1)",
            question: "Experienced artisans in Bat Trang always ______ their traditional pottery-making techniques to the younger generation.",
            options: ["pass down", "turn down", "look up", "close down"],
            correct_answer: "pass down"
        },
        {
            type: "grammar", tag: "Vocabulary (Unit 2)",
            question: "The municipal authority is constructing a new elevated sky train line to tackle heavy traffic ______ during peak hours.",
            options: ["congestion", "distraction", "priority", "relaxation"],
            correct_answer: "congestion"
        },
        {
            type: "grammar", tag: "Vocabulary (Unit 3)",
            question: "To stay in good shape, teenagers should maintain a ______ diet rich in green vegetables, lean protein, and fresh fruits.",
            options: ["well-balanced", "fattening", "depressed", "stressful"],
            correct_answer: "well-balanced"
        },
        {
            type: "grammar", tag: "Grammar (Wh-word + to-V)",
            question: "Lan felt completely confused because she had no idea ______ to ask for guidance on her science project.",
            options: ["who", "which", "what", "where"],
            correct_answer: "who"
        },
        {
            type: "grammar", tag: "Double Comparative (Unit 2)",
            question: "______ you revise your lessons for the midterm exam, the more confident you will feel in the examination room.",
            options: ["The harder", "The hardest", "Harder than", "More hard"],
            correct_answer: "The harder"
        },

        // --- PHẦN III: READING COMPREHENSION ---
        {
            type: "reading", tag: "Reading Comprehension",
            passage: "Adolescence is a transformative stage of life, but it also exposes teenagers to significant physical and emotional pressures. In modern society, academic expectations represent one of the primary causes of teen stress. Middle school students often spend between eight and ten hours a day studying at school and attending extra tuition classes. The constant fear of receiving low marks or disappointing their parents triggers chronic anxiety and sleep disorders.",
            question: "According to the passage, what triggers chronic anxiety and sleep disorders in teenagers?",
            options: [
                "The constant fear of receiving low marks or disappointing parents.",
                "Eating too many green vegetables and fresh fruits.",
                "Having excessive free time during summer weekends.",
                "Joining too many outdoor sports clubs after school."
            ],
            correct_answer: "The constant fear of receiving low marks or disappointing parents."
        },
        {
            type: "reading", tag: "Written Test (Trắc nghiệm hóa)",
            passage: "As the city gets more crowded, traffic congestion becomes worse.",
            question: "Choose the sentence that has the CLOSEST meaning using Double Comparative:<br><b>As the city gets more crowded, traffic congestion becomes worse.</b>",
            options: [
                "The more crowded the city gets, the worse traffic congestion becomes.",
                "The most crowded the city gets, the worst traffic congestion becomes.",
                "The more crowded the city gets, the more traffic congestion becomes.",
                "The less crowded the city gets, the worse traffic congestion becomes."
            ],
            correct_answer: "The more crowded the city gets, the worse traffic congestion becomes."
        }
    ];

    // 2. THUẬT TOÁN TRỘN ĐỀ (SHUFFLE)
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    let quizData = shuffleArray(rawQuizData);
    let currentQuestionIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // 3. HIỂN THỊ TÊN HỌC SINH TỪ LOCALSTORAGE
    document.addEventListener("DOMContentLoaded", () => {
        const studentName = localStorage.getItem('stm_user') || localStorage.getItem('student_name');
        if (studentName) {
            document.getElementById('student-name').innerHTML = `<i class="fa-regular fa-user"></i> ${studentName}`;
        }
        renderQuestion();
        startTimer(60 * 60); // Đếm ngược 60 phút
    });

    // 4. HÀM VẼ GIAO DIỆN CÂU HỎI
    function renderQuestion() {
        const q = quizData[currentQuestionIndex];
        const container = document.getElementById('question-container');
        
        if (!q.shuffledOptions) {
            q.shuffledOptions = shuffleArray(q.options);
        }
        const optionsList = q.shuffledOptions;
        
        let html = `<div class="question-type-badge">${q.tag}</div>`;
        
        if (q.type === "listening" && q.audio_url) {
            html += `<audio controls class="audio-player"><source src="${q.audio_url}" type="audio/mpeg">Trình duyệt không hỗ trợ audio.</audio>`;
        }
        
        if (q.type === "reading" && q.passage) {
            html += `<div class="reading-passage">${q.passage}</div>`;
        }
        
        html += `<div class="question-text">${currentQuestionIndex + 1}. ${q.question}</div>`;
        html += `<div class="options-grid">`;
        
        const labels = ['A', 'B', 'C', 'D'];
        optionsList.forEach((opt, index) => {
            const isSelected = userAnswers[currentQuestionIndex] === opt ? 'selected' : '';
            html += `
                <div class="option-btn ${isSelected}" onclick="selectOption('${opt.replace(/'/g, "\\'")}')">
                    <div class="option-marker">${labels[index]}</div>
                    <div>${opt}</div>
                </div>
            `;
        });
        
        html += `</div>`;
        container.innerHTML = html;
        
        document.getElementById('progress').innerText = `Câu ${currentQuestionIndex + 1} / ${quizData.length}`;
        document.getElementById('btn-prev').style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
        
        if (currentQuestionIndex === quizData.length - 1) {
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'flex';
        } else {
            document.getElementById('btn-next').style.display = 'flex';
            document.getElementById('btn-submit').style.display = 'none';
        }
    }

    function selectOption(selectedText) {
        userAnswers[currentQuestionIndex] = selectedText;
        renderQuestion();
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    function submitQuiz() {
        let correctCount = 0;
        for (let i = 0; i < quizData.length; i++) {
            if (userAnswers[i] === quizData[i].correct_answer) {
                correctCount++;
            }
        }
        
        const score10 = ((correctCount / quizData.length) * 10).toFixed(1);
        
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('correct-count').innerText = `${correctCount} / ${quizData.length}`;
        document.getElementById('final-score').innerText = score10;
    }

    function startTimer(durationInSeconds) {
        let timer = durationInSeconds;
        const timeDisplay = document.getElementById('time');
        
        const interval = setInterval(() => {
            let minutes = parseInt(timer / 60, 10);
            let seconds = parseInt(timer % 60, 10);
            
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            timeDisplay.innerText = minutes + ":" + seconds;
            
            if (--timer < 0) {
                clearInterval(interval);
                alert("Hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
                submitQuiz();
            }
        }, 1000);
    }
</script>
</body>
</html>
