<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm Bài Thi Trắc Nghiệm - STM English</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ========================================================
           1. THIẾT LẬP NỀN TẢNG & BIẾN MÀU SẮC ĐỒNG BỘ
           ======================================================== */
        :root {
            --primary: #0284c7;         /* Xanh dương chủ đạo (#0284c7) */
            --primary-dark: #0369a1;    /* Xanh dương đậm */
            --primary-deep: #0c4a6e;    /* Xanh navy biển sâu */
            --navy-dark: #0f172a;       /* Chữ tiêu đề chính */
            --bg-page: #f8fafc;         /* Nền xám xanh dịu mắt */
            --bg-card: #ffffff;         /* Nền thẻ trắng tinh khiết */
            --border-color: #e2e8f0;    /* Viền tinh tế */
            --border-active: #0284c7;   /* Viền khi chọn */
            --card-active-bg: #f0f9ff;  /* Nền khi chọn thẻ đáp án */
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-emerald: #10b981;  /* Xanh lục bảo */
            --accent-amber: #f59e0b;    /* Vàng cam đếm ngược */
            --accent-red: #ef4444;      /* Đỏ cảnh báo */
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 25px rgba(2, 132, 199, 0.08);
            --shadow-lg: 0 20px 45px rgba(15, 23, 42, 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ========================================================
           2. HEADER THANH ĐIỀU HƯỚNG
           ======================================================== */
        .quiz-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 0.9rem 2rem;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .navbar-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
        }

        .logo-box {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .brand-titles {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-family: 'Lexend', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--navy-dark);
            line-height: 1.1;
        }

        .brand-name span {
            color: var(--primary);
        }

        .exam-tag {
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Thí sinh Badge */
        .student-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #f0f9ff;
            color: var(--primary-dark);
            padding: 0.5rem 1.1rem;
            border-radius: var(--radius-full);
            border: 1px solid #bae6fd;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .student-badge i {
            color: var(--primary);
        }

        /* ========================================================
           3. CONTAINER CHÍNH & THANH THÔNG TIN (INFO BAR)
           ======================================================== */
        .quiz-wrapper {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .info-bar {
            background: white;
            border-radius: var(--radius-md);
            padding: 1.1rem 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .progress-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .progress-badge {
            background: #e0f2fe;
            color: var(--primary-deep);
            padding: 0.35rem 0.85rem;
            border-radius: var(--radius-full);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .progress-bar-track {
            width: 140px;
            height: 8px;
            background: #e2e8f0;
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #38bdf8);
            border-radius: var(--radius-full);
            transition: width 0.3s ease;
        }

        /* Đồng hồ đếm ngược */
        .timer-box {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .timer-box.warning {
            background: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
            animation: pulse-warn 1s infinite;
        }

        @keyframes pulse-warn {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ========================================================
           4. KHU VỰC CÂU HỎI & CÁC THẺ LỰA CHỌN
           ======================================================== */
        .question-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 2.2rem 2.4rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.8rem;
        }

        .question-number-tag {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-score-tag {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
        }

        .question-content {
            font-family: 'Lexend', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.6;
            color: var(--navy-dark);
            margin-bottom: 2rem;
        }

        /* Danh sách 4 tùy chọn A, B, C, D */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem 1.4rem;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .option-item:hover {
            border-color: #93c5fd;
            background: #f8fafc;
            transform: translateY(-1px);
        }

        /* Trạng thái được chọn */
        .option-item.selected {
            border-color: var(--border-active);
            background-color: var(--card-active-bg);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.12);
        }

        /* Radio đánh dấu tròn */
        .custom-radio {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .custom-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: transparent;
            transition: var(--transition);
        }

        .option-item.selected .custom-radio {
            border-color: var(--primary);
            background: white;
        }

        .option-item.selected .custom-radio::after {
            background: var(--primary);
        }

        /* Nhãn chữ cái A, B, C, D */
        .option-letter {
            font-family: 'Lexend', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-muted);
            background: #f1f5f9;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .option-item.selected .option-letter {
            background: var(--primary);
            color: white;
        }

        .option-text {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--navy-dark);
            flex: 1;
        }

        /* ========================================================
           5. THANH NÚT ĐIỀU HƯỚNG (NAV BUTTONS)
           ======================================================== */
        .quiz-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.85rem 1.6rem;
            border-radius: var(--radius-md);
            font-family: 'Lexend', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-prev {
            background: white;
            color: var(--navy-dark);
            border: 1.5px solid var(--border-color);
        }

        .btn-prev:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateX(-2px);
        }

        .btn-prev:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-next {
            background: white;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-next:hover {
            background: #f0f9ff;
            transform: translateX(2px);
        }

        .btn-submit-exam {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 0.85rem 2rem;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            margin-left: auto;
        }

        .btn-submit-exam:hover {
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0284c7, var(--primary-deep));
        }

        /* ========================================================
           6. BẢNG KẾT QUẢ (SCORE BOARD)
           ======================================================== */
        #scoreBoard {
            display: none;
            background: white;
            border-radius: var(--radius-lg);
            padding: 3.5rem 2.5rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 580px;
            margin: 1.5rem auto;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #d97706;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.2);
        }

        .score-title {
            font-family: 'Lexend', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--navy-dark);
            margin-bottom: 0.4rem;
        }

        .score-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Thẻ điểm lớn Hero Card */
        .score-card-hero {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1.5px solid #bae6fd;
            border-radius: var(--radius-lg);
            padding: 2rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .score-metric {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .metric-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value-huge {
            font-family: 'Lexend', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary-dark);
            line-height: 1;
        }

        .metric-divider {
            width: 1px;
            height: 60px;
            background: #cbd5e1;
        }

        .metric-value-correct {
            font-family: 'Lexend', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-emerald);
            line-height: 1;
        }

        .teacher-feedback {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 1.2rem;
            font-size: 0.95rem;
            color: var(--navy-dark);
            line-height: 1.6;
            margin-bottom: 2.2rem;
            border-left: 4px solid var(--primary);
            text-align: left;
        }

        .score-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn-back-classroom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            text-decoration: none;
            padding: 0.9rem 1.8rem;
            border-radius: var(--radius-md);
            font-family: 'Lexend', sans-serif;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        .btn-back-classroom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
        }

        .btn-retry {
            background: white;
            color: var(--text-muted);
            border: 1.5px solid var(--border-color);
            padding: 0.9rem 1.5rem;
            border-radius: var(--radius-md);
            font-family: 'Lexend', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-retry:hover {
            color: var(--navy-dark);
            border-color: #94a3b8;
            background: #f8fafc;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .navbar-content {
                flex-direction: column;
                align-items: flex-start;
            }
            .student-badge {
                align-self: flex-start;
            }
            .question-card {
                padding: 1.6rem 1.4rem;
            }
            .question-content {
                font-size: 1.1rem;
            }
            .quiz-actions {
                flex-wrap: wrap;
            }
            .btn-submit-exam {
                width: 100%;
                margin-left: 0;
                justify-content: center;
            }
            .score-card-hero {
                flex-direction: column;
                gap: 1.5rem;
            }
            .metric-divider {
                width: 80%;
                height: 1px;
            }
            .score-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- 1. HEADER THANH ĐIỀU HƯỚNG -->
    <header class="quiz-navbar">
        <div class="navbar-content">
            <a href="classroom.html" class="brand-section">
                <div class="logo-box">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="brand-titles">
                    <div class="brand-name">STM <span>English</span></div>
                    <div class="exam-tag">Đề thi thử Năng lực Tiếng Anh</div>
                </div>
            </a>
            
            <!-- Hiển thị tên Thí sinh từ localStorage -->
            <div class="student-badge">
                <i class="fa-solid fa-user-check"></i>
                <span>Thí sinh: <strong id="studentNameDisplay">Đang tải...</strong></span>
            </div>
        </div>
    </header>

    <!-- 2. KHU VỰC CHÍNH LÀM BÀI THI -->
    <main class="quiz-wrapper" id="quizContainer">
        
        <!-- Thanh Thông Tin (Info Bar: Đồng hồ đếm ngược + Tiến độ) -->
        <section class="info-bar">
            <div class="progress-info">
                <span class="progress-badge" id="progressText">Câu 1/3</span>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressBarFill" style="width: 33.33%;"></div>
                </div>
            </div>

            <div class="timer-box" id="timerBox">
                <i class="fa-regular fa-clock"></i>
                <span>Thời gian: <strong id="timerDisplay">15:00</strong></span>
            </div>
        </section>

        <!-- Thẻ Nội Dung Câu Hỏi & Các Lựa Chọn -->
        <section class="question-card">
            <div class="question-header">
                <span class="question-number-tag" id="questionNumberTag">CÂU HỎI 1</span>
                <span class="question-score-tag">Trắc nghiệm 4 lựa chọn</span>
            </div>

            <!-- Nội dung câu hỏi -->
            <h2 class="question-content" id="questionTitle">
                <!-- Nội dung câu hỏi được render bằng JavaScript -->
            </h2>

            <!-- Danh sách 4 tùy chọn A, B, C, D -->
            <div class="options-grid" id="optionsContainer">
                <!-- Các thẻ đáp án được render bằng JavaScript -->
            </div>
        </section>

        <!-- Các Nút Điều Hướng -->
        <footer class="quiz-actions">
            <button type="button" class="btn-action btn-prev" id="btnPrev" onclick="navigateQuestion(-1)">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Quay lại</span>
            </button>

            <button type="button" class="btn-action btn-next" id="btnNext" onclick="navigateQuestion(1)">
                <span>Tiếp theo</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <button type="button" class="btn-action btn-submit-exam" id="btnSubmitExam" onclick="confirmSubmitExam()">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Nộp Bài</span>
            </button>
        </footer>

    </main>

    <!-- 3. KHỐI BẢNG KẾT QUẢ (SCORE BOARD) -->
    <section class="quiz-wrapper" id="scoreBoard">
        <div class="score-icon-box">
            <i class="fa-solid fa-trophy"></i>
        </div>

        <h2 class="score-title">KẾT QUẢ BÀI THI</h2>
        <p class="score-subtitle">Hệ thống khảo sát đánh giá năng lực STM English</p>

        <!-- Khối điểm số nổi bật (Hero Score Card) -->
        <div class="score-card-hero">
            <div class="score-metric">
                <span class="metric-label">Điểm Số (Thang 10)</span>
                <span class="metric-value-huge" id="finalScoreDisplay">0.0</span>
            </div>
            <div class="metric-divider"></div>
            <div class="score-metric">
                <span class="metric-label">Số Câu Đúng</span>
                <span class="metric-value-correct" id="finalCorrectDisplay">0 / 3</span>
            </div>
        </div>

        <!-- Lời nhận xét sư phạm của Thầy Sơn -->
        <div class="teacher-feedback" id="teacherFeedbackText">
            <!-- Nhận xét sư phạm hiển thị dựa trên kết quả -->
        </div>

        <!-- Nút hành động -->
        <div class="score-actions">
            <a href="classroom.html" class="btn-back-classroom">
                <i class="fa-solid fa-door-open"></i>
                <span>Quay lại Lớp Học</span>
            </a>
            <button type="button" class="btn-retry" onclick="restartQuiz()">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Làm lại bài</span>
            </button>
        </div>
    </section>

    <!-- ========================================================
         4. JAVASCRIPT XỬ LÝ TOÀN BỘ LOGIC BÀI THI
         ======================================================== -->
    <script>
        // ==========================================
        // A. DỮ LIỆU CÂU HỎI TIẾNG ANH MẪU (3 CÂU)
        // ==========================================
        const quizQuestions = [
            {
                id: 1,
                question: "The artisans in Bat Trang pottery village always try to preserve their traditional ______ through generations.",
                options: [
                    "crafts",
                    "sculptures",
                    "customs",
                    "attractions"
                ],
                correctAnswer: 0 // A. crafts
            },
            {
                id: 2,
                question: "The more regularly you practice speaking English with your teacher, ______ confident you will become.",
                options: [
                    "the most",
                    "the more",
                    "more",
                    "the better"
                ],
                correctAnswer: 1 // B. the more
            },
            {
                id: 3,
                question: "Mark: \"Thank you very much for helping me prepare for the English presentation, Minh!\"\nMinh: \"______\"",
                options: [
                    "You're welcome.",
                    "Yes, of course.",
                    "I'd love to.",
                    "Never mind it."
                ],
                correctAnswer: 0 // A. You're welcome.
            }
        ];

        // ==========================================
        // B. BIẾN QUẢN LÝ TRẠNG THÁI (STATE)
        // ==========================================
        let currentQuestionIndex = 0;
        let userSelectedAnswers = {}; // Lưu đáp án: { 0: 1, 1: 0, 2: 0 }
        let totalTimeSeconds = 15 * 60; // 15 phút (900 giây)
        let timerInterval = null;
        let isSubmitted = false;

        // ==========================================
        // C. KHỞI CHẠY KHI TẢI TRANG
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadStudentInfo();
            renderQuestion(currentQuestionIndex);
            startCountdownTimer();
        });

        // 1. Lấy tên học sinh từ localStorage
        function loadStudentInfo() {
            const studentName = localStorage.getItem('student_name') || localStorage.getItem('stm_user') || 'Nguyễn Phương Minh';
            const studentDisplay = document.getElementById('studentNameDisplay');
            if (studentDisplay) {
                studentDisplay.innerText = studentName;
            }
        }

        // 2. Hàm hiển thị câu hỏi theo vị trí index
        function renderQuestion(index) {
            const q = quizQuestions[index];
            const total = quizQuestions.length;

            // Cập nhật thẻ chỉ số câu hỏi
            document.getElementById('questionNumberTag').innerText = `CÂU HỎI ${index + 1} / ${total}`;
            document.getElementById('questionTitle').innerText = q.question;
            document.getElementById('progressText').innerText = `Câu ${index + 1}/${total}`;

            // Cập nhật thanh tiến độ %
            const progressPercent = ((index + 1) / total) * 100;
            document.getElementById('progressBarFill').style.width = `${progressPercent}%`;

            // Render 4 thẻ tùy chọn A, B, C, D
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];

            q.options.forEach((optText, optIdx) => {
                const isSelected = userSelectedAnswers[index] === optIdx;
                
                const card = document.createElement('div');
                card.className = `option-item ${isSelected ? 'selected' : ''}`;
                card.onclick = () => selectOption(index, optIdx);

                card.innerHTML = `
                    <div class="custom-radio"></div>
                    <div class="option-letter">${letters[optIdx]}</div>
                    <div class="option-text">${optText}</div>
                `;
                container.appendChild(card);
            });

            // Cập nhật trạng thái các nút điều hướng
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            btnPrev.disabled = (index === 0);
            
            // Nếu ở câu cuối cùng thì đổi chữ nút 'Tiếp theo' hoặc làm mờ
            if (index === total - 1) {
                btnNext.style.display = 'none';
            } else {
                btnNext.style.display = 'inline-flex';
            }
        }

        // 3. Hàm chọn đáp án
        function selectOption(qIndex, optionIndex) {
            if (isSubmitted) return;
            userSelectedAnswers[qIndex] = optionIndex;
            renderQuestion(qIndex);
        }

        // 4. Hàm chuyển câu hỏi (Trước / Sau)
        function navigateQuestion(step) {
            const newIndex = currentQuestionIndex + step;
            if (newIndex >= 0 && newIndex < quizQuestions.length) {
                currentQuestionIndex = newIndex;
                renderQuestion(currentQuestionIndex);
            }
        }

        // 5. Đồng hồ đếm ngược (15:00)
        function startCountdownTimer() {
            const timerDisplay = document.getElementById('timerDisplay');
            const timerBox = document.getElementById('timerBox');

            timerInterval = setInterval(() => {
                totalTimeSeconds--;

                if (totalTimeSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "00:00";
                    alert("⏰ Đã hết thời gian làm bài! Hệ thống sẽ tự động nộp bài của bạn.");
                    calculateAndShowScore();
                    return;
                }

                const minutes = Math.floor(totalTimeSeconds / 60);
                const seconds = totalTimeSeconds % 60;
                const formattedMin = minutes < 10 ? '0' + minutes : minutes;
                const formattedSec = seconds < 10 ? '0' + seconds : seconds;

                timerDisplay.innerText = `${formattedMin}:${formattedSec}`;

                // Cảnh báo đỏ khi còn dưới 2 phút
                if (totalTimeSeconds <= 120) {
                    timerBox.classList.add('warning');
                }
            }, 1000);
        }

        // 6. Xác nhận nộp bài
        function confirmSubmitExam() {
            const answeredCount = Object.keys(userSelectedAnswers).length;
            const total = quizQuestions.length;

            let confirmMsg = "Bạn có chắc chắn muốn nộp bài thi ngay bây giờ không?";
            if (answeredCount < total) {
                confirmMsg = `Bạn mới hoàn thành ${answeredCount}/${total} câu hỏi. Bạn vẫn muốn nộp bài chứ?`;
            }

            if (confirm(confirmMsg)) {
                calculateAndShowScore();
            }
        }

        // 7. Hàm tính điểm và hiển thị Bảng Kết Quả
        function calculateAndShowScore() {
            if (isSubmitted) return;
            isSubmitted = true;
            clearInterval(timerInterval);

            // Tính số câu đúng
            let correctCount = 0;
            quizQuestions.forEach((q, idx) => {
                if (userSelectedAnswers[idx] === q.correctAnswer) {
                    correctCount++;
                }
            });

            const total = quizQuestions.length;
            const finalScore = ((correctCount / total) * 10).toFixed(1);

            // Cập nhật thông số lên Bảng Kết Quả
            document.getElementById('finalScoreDisplay').innerText = finalScore;
            document.getElementById('finalCorrectDisplay').innerText = `${correctCount} / ${total}`;

            // Tạo nhận xét sư phạm chuẩn mực
            const feedbackBox = document.getElementById('teacherFeedbackText');
            let feedback = "";

            if (finalScore >= 8.5) {
                feedback = `🌟 <strong>Thầy Nguyễn Hoàng Sơn ghi nhận:</strong> Em đã hoàn thành xuất sắc bài khảo sát! Khả năng ghi nhớ từ vựng và vận dụng cấu trúc ngữ pháp rất chuẩn xác. Hãy tiếp tục duy trì tinh thần học tập gương mẫu này nhé!`;
            } else if (finalScore >= 6.5) {
                feedback = `👍 <strong>Thầy Nguyễn Hoàng Sơn ghi nhận:</strong> Em đã nắm được các kiến thức trọng tâm của bài. Hãy rà soát lại các câu sai để hoàn thiện kỹ năng làm bài thi tốt hơn ở lần sau!`;
            } else {
                feedback = `📖 <strong>Thầy Nguyễn Hoàng Sơn nhắn nhủ:</strong> Em cần ôn tập thêm từ vựng và cấu trúc ngữ pháp của các bài học. Đừng ngần ngại xem lại các slide bài giảng và hỏi Thầy trên lớp nhé!`;
            }
            feedbackBox.innerHTML = feedback;

            // Ẩn khu vực làm bài, hiển thị Score Board ở giữa màn hình
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('scoreBoard').style.display = 'block';

            // Cuộn mượt lên đầu trang
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 8. Hàm làm lại bài
        function restartQuiz() {
            userSelectedAnswers = {};
            currentQuestionIndex = 0;
            isSubmitted = false;
            totalTimeSeconds = 15 * 60;

            document.getElementById('timerBox').classList.remove('warning');
            document.getElementById('scoreBoard').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'flex';

            renderQuestion(currentQuestionIndex);
            startCountdownTimer();
        }
    </script>
</body>
</html>
